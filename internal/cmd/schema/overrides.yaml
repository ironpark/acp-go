# Corrections the generator applies to the TypeScript schema snapshots in
# schema/typescript, for both protocol versions. Keys use TypeScript names.

# numbers gives the Go type of numbers the TypeScript schema types as a bare
# `number`, which would otherwise become float64: a member as Type.member, or
# a definition (or its one number alternative) as Type. Each is an integer in
# the protocol's Rust schema (reference/agent-client-protocol) with that
# format. Integers the Zod schema already marks (z.int() or wideInt()) need no
# entry, and an entry for one fails generation, as does an entry no version
# has. Since the SDK emits wideInt() for every 64-bit field, none is needed.
numbers: {}

# tristate lists, per protocol version, the optional nullable members where
# absent and null mean different things, typically an update that keeps the
# stored value when a member is left out and clears it on null. They become
# optional.Value fields. Each is MaybeUndefined in the protocol's Rust schema;
# members of raw JSON (unknown) already keep null and are left out. An entry
# its version lacks fails generation.
tristate:
  v1:
    - CompactionUpdate._meta
    - CompactionUpdate.error
    - CompactionUpdate.summary
    - SessionInfoUpdate.title
    - SessionInfoUpdate.updatedAt
    - SessionMessage._meta
    - SessionMessage.content
    - SessionMessage.recipientMessageId
    - SessionMessage.recipientSessionId
    - SessionMessage.senderMessageId
    - SessionMessage.senderSessionId
    - SubagentUpdate._meta
    - SubagentUpdate.additionalDirectories
    - SubagentUpdate.capabilities
    - SubagentUpdate.cwd
    - SubagentUpdate.description
    - SubagentUpdate.state
    - SubagentUpdate.title
  v2:
    - AgentMessage._meta
    - AgentMessage.content
    - AgentThought._meta
    - AgentThought.content
    - CompactionUpdate._meta
    - CompactionUpdate.error
    - CompactionUpdate.summary
    - SessionInfoUpdate._meta
    - SessionInfoUpdate.title
    - SessionInfoUpdate.updatedAt
    - SessionMessage._meta
    - SessionMessage.content
    - SessionMessage.recipientMessageId
    - SessionMessage.recipientSessionId
    - SessionMessage.senderMessageId
    - SessionMessage.senderSessionId
    - SubagentUpdate._meta
    - SubagentUpdate.additionalDirectories
    - SubagentUpdate.capabilities
    - SubagentUpdate.cwd
    - SubagentUpdate.description
    - SubagentUpdate.state
    - SubagentUpdate.title
    - TerminalUpdate._meta
    - TerminalUpdate.capabilities
    - TerminalUpdate.command
    - TerminalUpdate.cwd
    - TerminalUpdate.exitStatus
    - TerminalUpdate.output
    - TerminalUpdate.size
    - ToolCallUpdate._meta
    - ToolCallUpdate.capabilities
    - ToolCallUpdate.content
    - ToolCallUpdate.kind
    - ToolCallUpdate.locations
    - ToolCallUpdate.name
    - ToolCallUpdate.status
    - ToolCallUpdate.title
    - UsageUpdate.cost
    - UserMessage._meta
    - UserMessage.content
